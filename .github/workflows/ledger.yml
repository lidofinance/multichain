name: Ledger

on:
  push:
    branches: [main]
    paths:
      - ledger.json
      - ledger.schema.json
      - scripts/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/ledger.yml
  pull_request:
    paths:
      - ledger.json
      - ledger.schema.json
      - scripts/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/ledger.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check ledger key order
        run: uv run --locked python scripts/format_ledger.py check
      - name: Validate ledger
        run: uv run --locked python scripts/validate_ledger.py
