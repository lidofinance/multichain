name: Deploy dashboard to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Test dashboard build
        run: python3 -m unittest discover -s components/dashboard/tests -p 'test_dashboard_build.py'
      - name: Test dashboard runtime
        run: node --test components/dashboard/tests/test_dashboard_runtime.mjs
      - name: Build dashboard from GitHub main
        env:
          WSTETH_CCIP_READ_TOKEN: ${{ secrets.WSTETH_CCIP_READ_TOKEN || github.token }}
        run: python3 components/dashboard/scripts/build_dashboard.py --output "$RUNNER_TEMP/dashboard-site"
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/dashboard-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
