    l2TokenAdminRegistry:
      name: TokenAdminRegistry
      address: *l2TokenAdminRegistry
      checks:
        getTokenConfig:
          - args: [*l2WstETH]
            result: [*l2PoolOperationManager, *ZERO, *l2TokenPool]
    l2WstETH:
      name: L2WstETH
      address: *l2WstETH
      proxyName: OssifiableProxy
      implementation: *l2WstETHImpl
      proxyChecks:
        proxy__getAdmin: *l2OptimismBridgeExecutor
        # The implementation the proxy currently points at. Its anchor comes from state/l2.json
        # (.wstETHImpl, written by step 03), which step 08 reads from the state dir that travels
        # with the record and cross-checks against the record's proxy address first.
        # Scope: this pins the proxy to the implementation THIS deployment produced, so an upgrade
        # slipped in between the deploy and this run fails here. It says nothing about what that
        # implementation's bytecode IS — that is step 10 (verify-contracts) and its source match.
        proxy__getImplementation: *l2WstETHImpl
      checks:
        # Permit / versioning surface — new with the lido-l2-with-steth base (ADR l2-token-contract).
        # name and symbol are not cosmetic here: they are the EIP-712 domain's own fields, so a
        # signature is only ever valid against the exact pair the token was initialized with, and
        # drift silently invalidates every outstanding permit. getContractVersion == 2 proves
        # initialize() ran through _initialize_v2 and not the base's bare 3-arg initializer.
        # DOMAIN_SEPARATOR / eip712Domain are deliberately absent: both fold in chainid and the
        # token address, which this config carries no anchor for.
        name: "Wrapped liquid staked Ether 2.0"
        symbol: "wstETH"
        decimals: "18"
        getContractVersion: "2"
        hasRole:
          - args: [*DEFAULT_ADMIN_ROLE, *l2OptimismBridgeExecutor]
            result: true
          - args: [*DEFAULT_ADMIN_ROLE, *deployer]
            result: false
          - args: [*MINTER_ROLE, *l2TokenPool]
            result: true
          - args: [*BURNER_ROLE, *l2TokenPool]
            result: true
        # Role cardinality — the mint/burn authority over the L2 supply is the single most
        # sensitive grant in the deployment, and the per-address hasRole checks above cannot see a
        # SECOND minter. One holder each: OpExec (admin), the pool (minter), the pool (burner).
        getRoleMemberCount:
          - args: [*DEFAULT_ADMIN_ROLE]
            result: "1"
          - args: [*MINTER_ROLE]
            result: "1"
          - args: [*BURNER_ROLE]
            result: "1"
    # Persisted CCV stack — same notes as the l1 blocks; fee aggregator on L2 = the OpExec
    # (1_Deploy/2_Configure default it to the chain record's lido_dao_agent).
    l2MessageIdVerifier:
      name: DummyMessageIdVerifier
      address: *l2MessageIdVerifier
      checks:
        owner: *l2PoolOperationManager
        typeAndVersion: *verifierTypeAndVersion
        versionTag: *ccvVersionTag
        getAllowedFinalityConfig: *ccvAllowedFinality
        getStorageLocations: [*ccvStorageLocation]
        getDynamicConfig: [*l2OptimismBridgeExecutor, *deployer]
        getRemoteChainConfig:
          - args: [*l1ChainSelector]
            result:
              - [*l2CCIPRouter, *l1ChainSelector, *ccvAllowlistEnabled, *ccvFeeUSDCents, *ccvGasForVerification, *ccvPayloadSizeBytes]
              - []
          - args: [*l2ChainSelector]
            result:
              - [*ZERO, *l2ChainSelector, false, "0", "0", "0"]
              - []
    l2VerifierResolver:
      name: VersionedVerifierResolver
      address: *l2VerifierResolver
      checks:
        owner: *l2PoolOperationManager
        typeAndVersion: *resolverTypeAndVersion
        getFeeAggregator: *l2OptimismBridgeExecutor
        getAllOutboundImplementations:
          - [*l1ChainSelector, *l2MessageIdVerifier]
        getAllInboundImplementations:
          - [*ccvVersionTag, *l2MessageIdVerifier]
        getOutboundImplementation:
          - args: [*l1ChainSelector, "0x"]
            result: *l2MessageIdVerifier
          - args: [*l2ChainSelector, "0x"]
            result: *ZERO
        getInboundImplementation:
          - args: [*ccvVersionTag]
            result: *l2MessageIdVerifier
          - args: ["0x00000000"]
            result: *ZERO
    l2OptimismBridgeExecutor:
      name: OptimismBridgeExecutor
      address: *l2OptimismBridgeExecutor
      checks:
        getEthereumGovernanceExecutor: *l1LidoDAOAgent
        # The L2-side timelock parameters — the OpExec analogue of the POM delays pinned above,
        # and previously unasserted. See the &opExecDelay note: getDelay == 0 is the load-bearing
        # one, and pinning it makes "there is no L2 waiting period" a checked fact rather than a
        # claim. getMaximumDelay is pinned too because it bounds how strong that timelock could
        # ever be made by a later updateDelay.
        # Deliberately NOT pinned: getActionsSetCount. It is 0 today, but every genuine governance
        # action relayed to L2 increments it, so an assert here would fail on normal use.
        getDelay: *opExecDelay
        getGracePeriod: *opExecGracePeriod
        getMinimumDelay: *opExecMinDelay
        getMaximumDelay: *opExecMaxDelay
        # LIVE TESTNET INTERIM: the guardian (cancel authority over every queued action set) is the
        # deployer — the DeployL2Gov default; rotation requires a queued updateGuardian action
        # (onlyThis). Pinned so the cancel power can't silently sit with an unexpected key.
        getGuardian: *deployer
