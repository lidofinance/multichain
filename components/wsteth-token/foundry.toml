[profile.default]
src = "contracts"
test = "test"
solc = "0.8.10"
evm_version = "london"
optimizer = true
optimizer_runs = 200
libs = ["..", "../../libs"]
remappings = [
  "forge-std/=../../libs/forge-std/src/",
  "@openzeppelin/contracts/=../openzeppelin-contracts-4x/contracts/",
  "@openzeppelin/contracts-upgradeable/=../openzeppelin-contracts-upgradeable-4x/contracts/",
]
