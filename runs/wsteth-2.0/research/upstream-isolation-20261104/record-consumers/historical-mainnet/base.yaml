# Expected end state of the Base migration rehearsal after steps 01m–07 and the vote (06): lane
# handed to the Lido timelocks, the three proxies upgraded, both bridges in LEGACY with their
# timers armed, the L1 bridge authorized on the lane lockbox. A wiring-only state-mate config: relationships and constants,
# no addresses. The address book (wsteth.deployed.yaml) is GENERATED by script/08_verify_state.sh
# from the deploy record and the run's state files; authored inputs (role holders, Chainlink
# infrastructure, selectors, messengers) are in wsteth.inputs.<L2_CHAIN>.yaml.
#
# Verifies: pool/hooks/lockbox/CCV ownership = LidoTimelock; timelock roles (ADMIN = DAO with the
# deployer gone, PROPOSER = Chainlink MCMS, EXECUTOR = the CallProxy only, CANCELLER = Emergency
# Brakes + MCMS, PROPOSAL_QUEUE_HALT = Emergency Brakes, no bypasser), minimum delay, queue not
# halted, the five blocked selectors; TAR administrator = timelock with the pool bound; lane
# support, rate limits and fee config; the three upgraded proxies (implementation + admin slot),
# the bridges in LEGACY mode with their flags and wiring intact, the token at contract version 3
# with its roles (executor admin, pool and legacy bridge mint/burn); the executor pinned to the
# L1 Agent. Per-lane CCV tables are rendered by script/render-multichain-state.cjs from
# config/ccv-policy.json.

misc:
  - &ZERO "0x0000000000000000000000000000000000000000"
  # Token-bucket limits 2_Configure applies per lane from config/default_config.json
  # (rate_limiter_defaults): outbound 330e18 / inbound 500e18, both refilling over ~24h.
  - &rateLimitOutboundCapacity "330000000000000000000"
