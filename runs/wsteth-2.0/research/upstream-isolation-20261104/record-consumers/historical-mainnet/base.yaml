  - &hooksTypeAndVersion "PausableAdvancedPoolHooks 2.0.0"
  - &resolverTypeAndVersion "VersionedVerifierResolver 2.0.0"
  - &verifierTypeAndVersion "DummyMessageIdVerifier 1.0.0"
  - &destGasOverhead "150000"
  - &destBytesOverhead "32"
  # LidoTimelock: governance.min_delay_seconds (3 days) and expiry_period_seconds (14 days);
  # epoch 0 = never halted; the five blocked selectors from blocked_selectors, in insertion order.
  - &timelockMinDelay "259200"
  - &timelockExpiryPeriod "1209600"
  - &timelockEpoch "0"
  - &blockedSelectorCount "5"
  - &SEL_transferOwnership "0xf2fde38b"
  - &SEL_transferAdminRole "0xddadfa8e"
  - &SEL_upgradeToAndCall "0x4f1ef286"
  - &SEL_grantRole "0x2f2ff15d"
  - &SEL_revokeRole "0xd547741f"
  # OptimismBridgeExecutor on Base mainnet, read 2026-10-22: no L2-side delay, 1-day grace.
  - &opExecDelay "0"
  - &opExecGracePeriod "86400"
  - &opExecMinDelay "0"
  - &opExecMaxDelay "1"
  # Migration bridges right after the vote: still LEGACY on both sides, timers armed (per-run
