          #     the pool's 0xae39a257 never covered it, the argument lists differ.
          #   · hooks unpause() 0x3f4ba83a is Blocked (see getSelectorProposalMode above).
          - args: ["0xddadfa8e"]          # transferAdminRole(address,address)     [TAR]
            result: *selectorOverrideDelay
          - args: ["0x4e847fc7"]          # setPool(address,address)               [TAR]
            result: *selectorOverrideDelay
          - args: ["0xae39a257"]          # setDynamicConfig(address,address,address)  [pool]
            result: *selectorOverrideDelay
          - args: ["0x869b7f62"]          # setDynamicConfig((address,address))    [CCV verifier]
            result: *selectorOverrideDelay
          - args: ["0xbfeffd3f"]          # updateAdvancedPoolHooks(address)       [pool]
            result: *selectorOverrideDelay
          - args: ["0xefd07eec"]          # configureLockBoxes((uint64,address)[]) [pool L1]
