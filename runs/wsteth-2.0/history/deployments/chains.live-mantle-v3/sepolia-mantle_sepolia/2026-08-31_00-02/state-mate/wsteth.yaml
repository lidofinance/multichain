      name: VersionedVerifierResolver
      address: *l2VerifierResolver
      checks:
        owner: *l2PoolOperationManager
        typeAndVersion: *resolverTypeAndVersion
        getFeeAggregator: *l2OptimismBridgeExecutor
        getAllOutboundImplementations:
          - [*l1ChainSelector, *l2MessageIdVerifier]
        getAllInboundImplementations:
          - [*ccvVersionTag, *l2MessageIdVerifier]
        getOutboundImplementation:
          - args: [*l1ChainSelector, "0x"]
            result: *l2MessageIdVerifier
          - args: [*l2ChainSelector, "0x"]
            result: *ZERO
        getInboundImplementation:
          - args: [*ccvVersionTag]
            result: *l2MessageIdVerifier
          - args: ["0x00000000"]
            result: *ZERO
    l2OptimismBridgeExecutor:
      name: OptimismBridgeExecutor
      address: *l2OptimismBridgeExecutor
      checks:
        getEthereumGovernanceExecutor: *l1LidoDAOAgent
        # The L2-side timelock parameters — the OpExec analogue of the POM delays pinned above,
        # and previously unasserted. See the &opExecDelay note: getDelay == 0 is the load-bearing
        # one, and pinning it makes "there is no L2 waiting period" a checked fact rather than a
        # claim. getMaximumDelay is pinned too because it bounds how strong that timelock could
        # ever be made by a later updateDelay.
        # Deliberately NOT pinned: getActionsSetCount. It is 0 today, but every genuine governance
        # action relayed to L2 increments it, so an assert here would fail on normal use.
        getDelay: *opExecDelay
        getGracePeriod: *opExecGracePeriod
        getMinimumDelay: *opExecMinDelay
        getMaximumDelay: *opExecMaxDelay
        # LIVE TESTNET INTERIM: the guardian (cancel authority over every queued action set) is the
        # deployer — the DeployL2Gov default; rotation requires a queued updateGuardian action
        # (onlyThis). Pinned so the cancel power can't silently sit with an unexpected key.
        getGuardian: *deployer
