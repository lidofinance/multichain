            result: "259200"              # directCall(address,uint256,bytes)  [POM]
          - args: ["0x2e467eea"]
            result: "259200"              # setSelectorMode(bytes4,uint8)  [POM]
          - args: ["0x2f2ff15d"]
            result: "259200"              # grantRole(bytes32,address)  [POM]
          - args: ["0x34af1e5c"]
            result: "259200"              # pauseTokenPool()  [POM]
          - args: ["0x36568abe"]
            result: "259200"              # renounceRole(bytes32,address)  [POM]
          - args: ["0x39077537"]
            result: "259200"              # releaseOrMint((bytes,uint64,address,uint256,address,bytes,bytes,bytes))  [pool(L1)/pool(L2)]
          - args: ["0x3f4ba83a"]
            result: "259200"              # unpause()  [POM/hooks]
          - args: ["0x4ef34bc0"]
            result: "259200"              # setPolicyEngineAllowFailedDetach(address)  [hooks]
          - args: ["0x54c8a4f3"]
            result: "259200"              # applyAllowListUpdates(address[],address[])  [hooks]
          - args: ["0x597b95c3"]
            result: "259200"              # applyRemoteChainConfigUpdates((address,uint64,bool,uint16,uint32,uint16)[])  [verifier]
          - args: ["0x5cb80c5d"]
            result: "259200"              # withdrawFeeTokens(address[])  [resolver/verifier]
          - args: ["0x5ef2c64b"]
            result: "259200"              # updateStorageLocations(string[])  [verifier]
          - args: ["0x6135b085"]
            result: "259200"              # setPolicyEngine(address)  [hooks]
          - args: ["0x62ddd3c4"]
            result: "259200"              # addRemotePool(uint64,bytes)  [pool(L1)/pool(L2)]
          - args: ["0x63711574"]
            result: "259200"              # postflightCheck((bytes,uint64,address,uint256,address,bytes,bytes,bytes),uint256,bytes4)  [hooks]
          - args: ["0x7252cdcb"]
            result: "259200"              # setGlobalProposalMode(uint8)  [POM]
          - args: ["0x74fd18ac"]
            result: "259200"              # withdraw(address,uint64,uint256,address)  [lockbox]
          - args: ["0x7764b4d2"]
            result: "259200"              # setTokenPool(address)  [POM]
          - args: ["0x79ba5097"]
            result: "259200"              # acceptOwnership()  [hooks/lockbox/pool(L1)/pool(L2)/resolver/verifier]
          - args: ["0x7a9c2ef9"]
            result: "259200"              # applyOutboundImplementationUpdates((uint64,address)[])  [resolver]
          - args: ["0x8456cb59"]
            result: "259200"              # pause()  [POM/hooks]
          - args: ["0x85f0f0e1"]
            result: "259200"              # pauseRemoteLanes((uint64,uint8)[])  [POM/hooks]
          - args: ["0x864e0e4b"]
            result: "259200"              # initialize(address,uint8,uint40,uint40,(address,address,address,address[],address[],address[]))  [POM]
          - args: ["0x91a2749a"]
            result: "259200"              # applyAuthorizedCallerUpdates((address[],address[]))  [hooks/lockbox]
          - args: ["0x961e2e7c"]
            result: "259200"              # setThresholdAmount(uint256)  [hooks]
          - args: ["0x9a04e4b0"]
            result: "259200"              # setSelectorMinDelay(bytes4,uint40)  [POM]
          - args: ["0x9a2a4ce2"]
            result: "259200"              # setGlobalMinDelay(uint40)  [POM]
          - args: ["0x9a4575b9"]
            result: "259200"              # lockOrBurn((bytes,uint64,address,uint256,address))  [pool(L1)/pool(L2)]
          - args: ["0xa36a7fee"]
            result: "259200"              # deposit(address,uint64,uint256)  [lockbox]
          - args: ["0xa53a1adf"]
            result: "259200"              # approve(bytes32)  [POM]
          - args: ["0xa579370a"]
            result: "259200"              # setGlobalExpiryPeriod(uint40)  [POM]
          - args: ["0xa8027c0f"]
            result: "259200"              # preflightCheck((bytes,uint64,address,uint256,address),bytes4,bytes,uint256)  [hooks]
          - args: ["0xacfecf91"]
            result: "259200"              # removeRemotePool(uint64,bytes)  [pool(L1)/pool(L2)]
          - args: ["0xb6cfa3b7"]
            result: "259200"              # setAllowedFinalityConfig(bytes4)  [pool(L1)/pool(L2)]
          - args: ["0xc4d252f5"]
            result: "259200"              # cancel(bytes32)  [POM]
          - args: ["0xc7230a60"]
            result: "259200"              # withdrawFeeTokens(address[],address)  [pool(L1)/pool(L2)]
          - args: ["0xc9b146b3"]
            result: "259200"              # applyAllowlistUpdates((uint64,bool,address[],address[])[])  [verifier]
          - args: ["0xd547741f"]
            result: "259200"              # revokeRole(bytes32,address)  [POM]
          - args: ["0xd966866b"]
            result: "259200"              # applyCCVConfigUpdates((uint64,address[],address[],address[],address[])[])  [hooks]
          - args: ["0xdc04fa1f"]
            result: "259200"              # applyTokenTransferFeeConfigUpdates((uint64,(uint32,uint32,uint32,uint32,uint16,uint16,bool))[],uint64[])  [pool(L1)/pool(L2)]
          - args: ["0xdcbd41bc"]
            result: "259200"              # setRateLimitConfig((uint64,bool,(bool,uint128,uint128),(bool,uint128,uint128))[])  [pool(L1)/pool(L2)]
          - args: ["0xe7076918"]
            result: "259200"              # applyInboundImplementationUpdates((bytes4,address)[])  [resolver]
          - args: ["0xe8a1da17"]
            result: "259200"              # applyChainUpdates(uint64[],(uint64,bytes[],bytes,(bool,uint128,uint128),(bool,uint128,uint128))[])  [pool(L1)/pool(L2)]
          - args: ["0xf7270dff"]
            result: "259200"              # propose(address,uint256,bytes,bytes32,bytes32,uint40)  [POM]
          - args: ["0xfb6f93f9"]
            result: "259200"              # veto(bytes32)  [POM]
          - args: ["0xfbc801a7"]
            result: "259200"              # lockOrBurn((bytes,uint64,address,uint256,address),bytes4,bytes)  [pool(L1)/pool(L2)]
        # Proposal EXECUTION WINDOW — the delays above set when a proposal becomes executable,
        # this sets when it stops being executable ([timestamp+delay, timestamp+expiryPeriod]).
        # Same DEFAULT_ADMIN reach and the same no-delay-of-its-own setter as the delays, so it is
        # pinned alongside them; see &globalExpiryPeriod for what drift in either direction does.
        getGlobalExpiryPeriod: *globalExpiryPeriod
        # Never paused ⇒ every proposal reading above is against the live epoch, and the manager's
        # governance path is open rather than sitting under an unnoticed emergency stop.
        getEpoch: *pomEpoch
        paused: false
        # THE manager→pool binding: the pool this POM actually owns and forwards calls to. Every
        # `owner: *l1PoolOperationManager` above says the pool points at the POM; this is the
        # other direction, and it is what setTokenPool (DEFAULT_ADMIN, no selector override —
        # only the 3-day global delay) would move.
        getTokenPool: *l1TokenPool
        # Derived: reads TokenPool(getTokenPool()).getAdvancedPoolHooks(). Asserted here as well as
        # on the pool so the pair cannot drift apart through either hop.
        getAdvancedPoolHooks: *l1AdvancedPoolHooks
        # Role CARDINALITY. Every hasRole assert above is per-address and blind to an extra holder;
        # these counts are the only checks that can fail on one. Pinned as deployed:
        #   DEFAULT_ADMIN 1 — the L1 Agent alone (deployer revoked)
        #   PROPOSER      1 — chainlink_mcms
        #   GUARDIAN      0 — unseated; Emergency uses PAUSER_ROLE.pause (epoch++)
        #   PAUSER        — {emergency_brakes, chainlink_mcms} deduplicated; expected count is
        #                   DERIVED from the deploy record by step 08 (*pauserRoleMemberCount),
        #                   1 while the two are collapsed onto one testnet key, 2 once rotated
        #   UNPAUSER      0 — unassigned by design; only DEFAULT_ADMIN can unpause
        #   EXECUTOR      0 — unassigned, which in POM means ANYONE may execute an elapsed
        #                   proposal. That is the deployed intent; pinned so it stays a decision
        #                   rather than a surprise, and so a later grant fails verification.
        getRoleMemberCount:
          - args: [*DEFAULT_ADMIN_ROLE]
            result: "1"
          - args: [*PROPOSER_ROLE]
            result: "1"
          - args: [*GUARDIAN_ROLE]
            result: "0"
          - args: [*PAUSER_ROLE]
            result: *pauserRoleMemberCount
          - args: [*UNPAUSER_ROLE]
            result: "0"
          - args: [*EXECUTOR_ROLE]
            result: "0"
    l1LockBox:
      name: ERC20LockBox
      address: *l1LockBox
      checks:
        owner: *l1PoolOperationManager
        typeAndVersion: *lockBoxTypeAndVersion
        # The token actually held in custody. Constructor-immutable, and the pool refuses to bind a
        # lockbox whose token differs — but that check runs at configure time, so the invariant is
        # asserted here rather than assumed.
        getToken: *l1WstETH
        # Custody gate (§3.4): ONLY the pool may deposit/withdraw the locked L1 principal. A stale
        # or extra authorized caller (e.g. from a partial redeploy) must fail verification.
        getAllAuthorizedCallers: [*l1TokenPool]
    l1TokenAdminRegistry:
      name: TokenAdminRegistry
      address: *l1TokenAdminRegistry
      checks:
        getTokenConfig:
          - args: [*l1WstETH]
            result: [*l1PoolOperationManager, *ZERO, *l1TokenPool]
    # Persisted CCV stack (PERMISSIONS.md §3.9). Owner and allowlistAdmin are residual powers — the
    # §5 matrix row "CCV .owner = POM" had no check before these blocks — but the blocks now also
    # pin the ROUTING itself: which verifier the resolver hands a message to, and on which lane.
    # That routing is not inert. A CCIP 2.0 ramp pair IS registered for this lane on both routers
    # (OnRamp 2.0.0 / OffRamp 2.0.0 alongside the 1.5 and 1.6 ramps), so a 2.0 OffRamp can read the
    # inbound set and a 2.0 OnRamp the outbound one. Earlier revisions of this file described the
    # CCV config as inert on the ground that no 2.0 OffRamp existed on these testnets; that is no
    # longer true on chain. Which ramp a given message traverses still depends on how it is sent —
    # see ARCHITECTURE.md §6 / LIVE_DEPLOY_CONCERNS.md §2, both of which need the same correction.
    l1MessageIdVerifier:
      name: DummyMessageIdVerifier
      address: *l1MessageIdVerifier
      checks:
        owner: *l1PoolOperationManager
        typeAndVersion: *verifierTypeAndVersion
        # The bytes4 key the resolver's inbound table is indexed by; same anchor is asserted as
        # that table's key in l1VerifierResolver below, so tag and table cannot drift apart.
        versionTag: *ccvVersionTag
        getAllowedFinalityConfig: *ccvAllowedFinality
        getStorageLocations: [*ccvStorageLocation]
        # [feeAggregator, allowlistAdmin]. allowlistAdmin = deployer is the 1_Deploy default and is
        # NOT rotated by the pipeline (rotation needs POM setDynamicConfig); it can mutate per-lane
        # sender allowlists (applyAllowlistUpdates is owner-OR-allowlistAdmin). Pinned so the
        # residual stays visible and any unexpected holder fails verification.
        getDynamicConfig: [*l1LidoDAOAgent, *deployer]
        # Per-lane verifier config: [(router, remoteChainSelector, allowlistEnabled, feeUSDCents,
        # gasForVerification, payloadSizeBytes), allowedSendersList]. The router binding is the
        # load-bearing field — it names the router this verifier will serve. allowlistEnabled is
        # FALSE, i.e. any sender may use the lane and the empty senders list is not a restriction;
        # pinned so enabling the allowlist (or seeding it) cannot pass silently.
        # The second entry is the negative case: no config for any OTHER selector, so a stray lane
        # left over from a partial redeploy fails verification.
        getRemoteChainConfig:
          - args: [*l2ChainSelector]
            result:
              - [*l1CCIPRouter, *l2ChainSelector, *ccvAllowlistEnabled, *ccvFeeUSDCents, *ccvGasForVerification, *ccvPayloadSizeBytes]
              - []
          # Unconfigured selector: the getter echoes the queried selector back but leaves every
          # other field zeroed — router == address(0) is what marks it absent.
          - args: [*l1ChainSelector]
            result:
              - [*ZERO, *l1ChainSelector, false, "0", "0", "0"]
              - []
    l1VerifierResolver:
      name: VersionedVerifierResolver
      address: *l1VerifierResolver
      checks:
        owner: *l1PoolOperationManager
        typeAndVersion: *resolverTypeAndVersion
        getFeeAggregator: *l1LidoDAOAgent
        # THE routing tables. The hooks' CCV set names the RESOLVER, not a verifier, so without
        # these two checks the resolver could dispatch to any contract and everything else here
        # would still pass. Asserting the FULL tables (not just a lookup) also pins their length:
        # exactly one outbound lane and one inbound version, no extra entries.
        getAllOutboundImplementations:
          - [*l2ChainSelector, *l1MessageIdVerifier]
        getAllInboundImplementations:
          - [*ccvVersionTag, *l1MessageIdVerifier]
        # The same tables through the getters the ramps actually call, plus the negative case:
        # an unconfigured selector / version tag resolves to address(0) rather than a stale verifier.
        # getOutboundImplementation ignores its extraArgs parameter.
        getOutboundImplementation:
          - args: [*l2ChainSelector, "0x"]
            result: *l1MessageIdVerifier
          - args: [*l1ChainSelector, "0x"]
            result: *ZERO
        # Takes the raw verifierResults; only the leading 4 bytes are used as the version key.
        getInboundImplementation:
          - args: [*ccvVersionTag]
            result: *l1MessageIdVerifier
          - args: ["0x00000000"]
            result: *ZERO

l2:
  # Env var NAME (not a URL): L2_RPC is exported by script/_common.sh from L2_CHAIN
  # (RPC_<UPPERCASED SLUG>), so this wiring stays L2-chain-agnostic. Manual state-mate runs
  # outside step 08 must export L2_RPC themselves.
  rpcUrl: L2_RPC
  contracts:
    l2TokenPool:
      name: BurnMintTokenPool
      address: *l2TokenPool
      checks:
        owner: *l2PoolOperationManager
        typeAndVersion: *l2PoolTypeAndVersion
        getToken: *l2WstETH
        getTokenDecimals: *tokenDecimals
        getDynamicConfig: [*l2CCIPRouter, *ZERO, *ZERO]
        # See the l1TokenPool block for what these three pin.
        getRmnProxy: *l2RmnProxy
        getAllowedFinalityConfig: *poolAllowedFinality
        getAdvancedPoolHooks: *l2AdvancedPoolHooks
        isSupportedChain:
          - args: [*l1ChainSelector]
            result: true
        getSupportedChains: [*l1ChainSelector]
        getTokenTransferFeeConfig:
          - args: [*ZERO, *l1ChainSelector, "0x00000000", "0x"]
            result: [*destGasOverhead, *destBytesOverhead, "0", "0", "0", "0", true]
        # Per-lane token-bucket limits (gate A-RL-01). [outbound, inbound] for the L1 lane;
        # tokens/lastUpdated are dynamic → skipped.
        # TokenBucket fields are matched positionally: [tokens, lastUpdated, isEnabled, capacity, rate].
        # tokens/lastUpdated are dynamic → null (skipped); only isEnabled/capacity/rate are asserted.
        getCurrentRateLimiterState:
          - args: [*l1ChainSelector, false]
            result:
              - [null, null, true, *rateLimitOutboundCapacity, *rateLimitOutboundRate]   # outbound (send)
              - [null, null, true, *rateLimitInboundCapacity, *rateLimitInboundRate]     # inbound (receive)
        # Remote-lane binding (custody gate) — see the l1Pool note: abi.encode(address) compares
        # numerically equal to the plain address alias.
        getRemotePools:
          - args: [*l1ChainSelector]
            result: [*l1TokenPool]
        getRemoteToken:
          - args: [*l1ChainSelector]
            result: *l1WstETH
    l2AdvancedPoolHooks:
      name: PausableAdvancedPoolHooks
      address: *l2AdvancedPoolHooks
      checks:
        owner: *l2PoolOperationManager
        typeAndVersion: *hooksTypeAndVersion
        # Same CCV surface as the l1 block — see the comments there.
        getThresholdAmount: *ccvThresholdAmount
        getCCVConfig:
          - args: [*l1ChainSelector]
            result:
              - [*l2VerifierResolver]
              - []
              - [*l2VerifierResolver]
              - []
          - args: [*l2ChainSelector]
            result: [[], [], [], []]
        getAllCCVConfigs:
          - [*l1ChainSelector, [*l2VerifierResolver], [], [*l2VerifierResolver], []]
        # Pause surface. Global pause and the per-(lane, direction) pauses both sit in front of
        # preflight/postflight, so either one silently halts transfers; asserted clear so a
        # verification run cannot report a healthy deployment that in fact cannot move tokens.
        # getDisabledRemoteLanes fields: [chainSelector, direction] (0=Outbound, 1=Inbound).
        paused: false
        getDisabledRemoteLanes: []
        # Who may CALL the hooks. AuthorizedCallers gates preflight/postflight, so this is what
        # stops a third party from driving the hook logic directly. Deployed with the pool as the
        # sole caller (1_Deploy passes exactly one); the FULL list is asserted, so an extra caller fails.
        getAllAuthorizedCallers: [*l2TokenPool]
        # Sender allowlist: DISABLED (i_allowlistEnabled is constructor-immutable and 1_Deploy
        # passes an empty allowlist, so it can never be turned on for this deployment — only
        # re-deployed). Pinned together with the empty list so the pair stays coherent: were the
        # flag ever true with an empty list, no sender could transfer at all.
        getAllowListEnabled: false
        getAllowList: []
        # Policy engine disabled (address(0) ⇒ preflight/postflight skip the policy call). A
        # non-zero value here would insert an unreviewed contract into every transfer's hot path.
        getPolicyEngine: *ZERO
        getRequiredCCVs:
          - args: [*ZERO, *l1ChainSelector, *ccvProbeAmountSmall, "0x00000000", "0x", *DIRECTION_OUTBOUND]
            result: [*l2VerifierResolver]
          - args: [*ZERO, *l1ChainSelector, *ccvProbeAmountLarge, "0x00000000", "0x", *DIRECTION_OUTBOUND]
            result: [*l2VerifierResolver]
          - args: [*ZERO, *l1ChainSelector, *ccvProbeAmountSmall, "0x00000000", "0x", *DIRECTION_INBOUND]
            result: [*l2VerifierResolver]
          - args: [*ZERO, *l1ChainSelector, *ccvProbeAmountLarge, "0x00000000", "0x", *DIRECTION_INBOUND]
            result: [*l2VerifierResolver]
    l2PoolOperationManager:
      name: PoolOperationManager
      address: *l2PoolOperationManager
      checks:
        hasRole:
          - args: [*DEFAULT_ADMIN_ROLE, *l2OptimismBridgeExecutor]
            result: true
          - args: [*DEFAULT_ADMIN_ROLE, *deployer]
            result: false
          # GUARDIAN_ROLE unseated — same as l1PoolOperationManager.
          - args: [*GUARDIAN_ROLE, *guardian]
            result: false
          - args: [*GUARDIAN_ROLE, *emergencyBrakes]
            result: false
          # Pause roles: emergency_brakes + chainlink_mcms only. OpExec pauses via DEFAULT_ADMIN, not an explicit grant.
          - args: [*PAUSER_ROLE, *emergencyBrakes]
            result: true
          - args: [*PAUSER_ROLE, *chainlinkMcms]
            result: true
          - args: [*PAUSER_ROLE, *l2OptimismBridgeExecutor]
            result: false
          # Proposer = chainlink_mcms.
          - args: [*PROPOSER_ROLE, *chainlinkMcms]
            result: true
          # Unpauser is unassigned by design — only DEFAULT_ADMIN (OpExec) can unpause via onlyRoleOrAdmin.
          - args: [*UNPAUSER_ROLE, *l2OptimismBridgeExecutor]
            result: false
        # A-POM-01 timelock parameters — same pins as l1PoolOperationManager (see the notes there, incl. the
        # upstream transferAdminRole selector bug).
        getGlobalProposalMode: *VETO
        getGlobalMinDelay: *globalMinDelay
        getSelectorProposalMode:
          - args: ["0xf2fde38b"]          # transferOwnership(address)
            result: *BLOCKED
          - args: ["0x3f4ba83a"]          # unpause()  [POM/hooks]
