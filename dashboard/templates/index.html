<title>CCIP Lane Watch</title>
<!--
  Deployment records and script/ccip-inventory.sh belong to
  https://github.com/lidofinance/wsteth-ccip (the original source repository).

  CCIP Lane Watch — a live inventory of the CCIP system contracts on both sides of a lane.

  No backend. The page reads the Chainlink registry (docs.chain.link/api/ccip/v1, CORS is open)
  for entry points, then crawls the contract graph over each chain's public JSON-RPC using the
  same logic as script/ccip-inventory.sh: it follows the address fields of every config getter and
  asks each contract it reaches for its own typeAndVersion(). Selectors are hardcoded, so no
  keccak is needed in the browser; calls go out batched, one POST per crawl round.

  The registry publishes five addresses per chain and NO versions; /lanes adds a version, but only
  for the ramps; RMNRemote / FeeQuoter / NonceManager and the whole 2.0 CCV stack are absent from
  the API altogether — the crawl is what finds them.

  The build reads ledger.json and the active public record from wsteth-ccip main.
  LIVE overlays the testnet contracts that are absent from the Chainlink registry.

  Build with scripts/build_dashboard.py; serve the generated site from any static host.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

  --bg:#EEF0EE; --surface:#FFFFFF; --surface-2:#E7EAE8;

    --cl:#93A6FF; --cl-soft:#1A2340;
    --ours:#F284C2; --ours-soft:#331127;
    --ok:#5CCB93; --ok-soft:#10281E;
    --bad:#FF8F7F; --bad-soft:#301715;
    --warn:#E2B856; --warn-soft:#2B2312;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#161F1C; --surface-2:#1D2724;
  --ink:#E2E9E6; --ink-2:#96A39F; --ink-3:#7C8985;
  --rule:#28352F; --rule-strong:#43554F;
  --cl:#93A6FF; --cl-soft:#1A2340;
  --ours:#F284C2; --ours-soft:#331127;
  --ok:#5CCB93; --ok-soft:#10281E;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs-md); line-height:1.5;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--sp-4)}
a{color:inherit; text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--rule-strong)}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit; color:inherit}

/* ── app bar ────────────────────────────────────────────────────── */
.appbar{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:2px solid var(--ink);
}
.appbar-in{
  max-width:var(--maxw); margin:0 auto; padding:var(--sp-3) var(--sp-4);
  display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:var(--sp-3); flex:none}
.mark{
  width:30px; height:30px; flex:none; display:grid; place-items:center;
  background:var(--ink); color:var(--surface); font-family:var(--mono);
  font-size:12px; font-weight:700; letter-spacing:.02em;
}
.brand h1{margin:0; font-size:var(--fs-md); font-weight:700; letter-spacing:-.01em; white-space:nowrap}
.brand .sub{margin:0; font-size:var(--fs-xs); color:var(--ink-3); font-family:var(--mono)}
.brand .sub a{color:var(--cl); text-decoration-color:var(--cl)}
.brand .sub a:hover{text-decoration-color:var(--cl); background:var(--cl-soft)}
.foot a{color:var(--cl); text-decoration-color:var(--cl)}
.spacer{flex:1 1 auto}
.tabs{display:flex; gap:var(--sp-2); flex-wrap:wrap; min-width:0}
.tab{
  display:inline-flex; align-items:center; gap:var(--sp-2);
  padding:6px 12px; border:1px solid var(--rule); background:var(--surface);
  cursor:pointer; font-size:var(--fs-sm); font-weight:500; white-space:nowrap;
}
.tab:hover{border-color:var(--rule-strong)}
.tab.active{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.tab-dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--rule-strong)}
.tab-dot[data-s="ok"]{background:var(--ok)}
.tab-dot[data-s="warn"]{background:var(--warn)}
.tab-dot[data-s="bad"]{background:var(--bad)}
.tab-dot[data-s="busy"]{background:var(--cl); animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.ctl{display:flex; align-items:center; gap:var(--sp-2); flex:none}
select,input[type=text],input[type=url]{
  font:inherit; font-size:var(--fs-sm); padding:5px 8px; background:var(--surface);
  color:var(--ink); border:1px solid var(--rule);
}
select:focus,input:focus{outline:2px solid var(--cl); outline-offset:-1px}
.btn{
  padding:6px 12px; border:1px solid var(--rule); background:var(--surface);
  cursor:pointer; font-size:var(--fs-sm); font-weight:500;
}
.btn:hover{border-color:var(--rule-strong)}
.btn:disabled{opacity:.5; cursor:wait}
.btn-primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.stamp{font-family:var(--mono); font-size:var(--fs-xs); color:var(--ink-3); white-space:nowrap}
.stamp b{color:var(--ink); font-weight:500}

/* ── primitives ─────────────────────────────────────────────────── */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 7px;

  border:1px solid transparent; white-space:nowrap;
}
.c-ok{color:var(--ok); background:var(--ok-soft); border-color:var(--ok-soft)}
.c-bad{color:var(--bad); background:var(--bad-soft); border-color:var(--bad-soft)}
.c-warn{color:var(--warn); background:var(--warn-soft); border-color:var(--warn-soft)}
.c-cl{color:var(--cl); background:var(--cl-soft); border-color:var(--cl-soft)}
.c-ours{color:var(--ours); background:var(--ours-soft); border-color:var(--ours-soft)}
.c-mute{color:var(--ink-3); background:var(--surface-2); border-color:var(--surface-2)}
.dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.live .dot{animation:pulse 1.6s ease-in-out infinite}
.mono{font-family:var(--mono)}
.addr{font-family:var(--mono); font-size:var(--fs-xs); color:var(--ink-2); word-break:break-all}
.copy{

  font-family:var(--mono); font-size:var(--fs-xs);
}
.copy:hover{color:var(--ink)}
.muted{color:var(--ink-3)}
.eyebrow{
  font-family:var(--mono); font-size:var(--fs-xs); text-transform:uppercase;
  letter-spacing:.08em; color:var(--ink-3); font-weight:500;
}

/* ── cards / grid ───────────────────────────────────────────────── */
main{padding:var(--sp-5) 0 var(--sp-6)}
.card{background:var(--surface); border:1px solid var(--rule); margin:0 0 var(--sp-4)}
.card-head{
  display:flex; align-items:baseline; gap:var(--sp-3); flex-wrap:wrap;
  padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--rule);
}
.card-head h2{margin:0; font-size:var(--fs-md); font-weight:700; letter-spacing:-.01em}
.card-head .eyebrow{margin-right:auto}
.card-body{padding:var(--sp-4)}
.card-body.flush{padding:0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); align-items:start}
@media (max-width:980px){ .grid2{grid-template-columns:1fr} }
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px var(--sp-3); font-size:var(--fs-sm)}
.kv dt{font-family:var(--mono); font-size:var(--fs-xs); color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; padding-top:3px}
.kv dd{margin:0; min-width:0}
.strip{display:flex; flex-wrap:wrap; gap:var(--sp-2) var(--sp-3); align-items:center}

/* ── tables ─────────────────────────────────────────────────────── */
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:560px; font-size:var(--fs-sm)}
th,td{text-align:left; padding:7px var(--sp-3); border-bottom:1px solid var(--rule); vertical-align:top}
thead th{

tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.t-name{font-weight:500; white-space:nowrap}
td.t-ver{font-family:var(--mono); font-size:var(--fs-xs); white-space:nowrap}
td.t-via{color:var(--ink-3); font-size:var(--fs-xs); font-family:var(--mono)}
.rowmark{display:inline-block; width:3px; align-self:stretch}
/* overview: amounts right-aligned, share as a bar the eye can scan down the column */
td.ovnum{font-family:var(--mono); text-align:right; white-space:nowrap}
td.ovshare{white-space:nowrap; min-width:132px}
.ovbar{
  display:inline-block; width:74px; height:7px; background:var(--surface-2);
  vertical-align:middle; margin-right:var(--sp-2);
}
.ovbar i{display:block; height:100%; background:var(--cl); min-width:1px}
.ovpct{font-family:var(--mono); font-size:var(--fs-xs); color:var(--ink-2)}

/* ── misc ───────────────────────────────────────────────────────── */
.banner{
  border-left:3px solid var(--bad); background:var(--bad-soft); color:var(--bad);
  padding:var(--sp-2) var(--sp-3); font-size:var(--fs-sm); margin:0 0 var(--sp-3);
}
.banner.warn{border-left-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
.checks{list-style:none; margin:0; padding:0; font-size:var(--fs-sm)}
.checks li{display:flex; gap:var(--sp-2); padding:4px 0; align-items:flex-start}
.checks .m{font-family:var(--mono); font-size:var(--fs-xs); padding-top:3px; flex:none; width:1.1em}
.skel{
  display:inline-block; height:.85em; min-width:5em; background:var(--surface-2);
  animation:sk 1.2s ease-in-out infinite;
}
@keyframes sk{0%,100%{opacity:.45}50%{opacity:.9}}
.empty{padding:var(--sp-5); text-align:center; color:var(--ink-3); font-size:var(--fs-sm)}
.rpcrow{display:grid; grid-template-columns:minmax(160px,auto) 1fr auto; gap:var(--sp-2); align-items:center; margin:0 0 var(--sp-2)}
.rpcrow .nm{font-size:var(--fs-sm)}
.rpcrow .nm small{display:block; font-family:var(--mono); font-size:var(--fs-xs); color:var(--ink-3)}
.foot{border-top:2px solid var(--ink); padding:var(--sp-4) 0 var(--sp-6); color:var(--ink-3); font-size:var(--fs-xs); font-family:var(--mono); line-height:1.8}
.hidden{display:none !important}
</style>
</head>

<script>
"use strict";
// ─────────────────────────────────────────────────────────────────────────────
// 1. Constants: selectors, default RPCs, explorers
// ─────────────────────────────────────────────────────────────────────────────
const API = "https://docs.chain.link/api/ccip/v1";

// Selectors precomputed with `cast sig`, so no keccak is needed in the browser.
const SEL = {

  symbol:                       "0x95d89b41",
  decimals:                     "0x313ce567",
  totalSupply:                  "0x18160ddd",

  getExpectedNextMessageNumber: "0xe8d80861", // OnRamp 2.0
  getExpectedNextSequenceNumber:"0x9041be3d", // OnRamp 1.6
  getPool:                      "0xbbe4f6db", // TokenAdminRegistry.getPool(address)
  getUnsiloedLiquidity:         "0xaf0e58b9",
  isSiloed:                     "0x31238ffc", // isSiloed(uint64)
  // The deployed SiloedLockReleaseTokenPool answers getAvailableTokens(uint64), NOT the
  // getSiloedTokenBalance(uint64) of the vendored source — that one reverts on chain.
  // For a siloed destination it returns that destination's own balance; for an unsiloed one
  // it returns the shared unsiloed liquidity, which is why the overview cannot split the
  // unsiloed part per network.
  getAvailableTokens:           "0xf1e73399",
  stEthPerToken:                "0x035faf82", // wstETH → stETH rate, for the USD column
  latestAnswer:                 "0x50d25bcd", // Chainlink aggregator
};

// Public RPCs with open CORS (all verified). User overrides live in localStorage.
const DEFAULT_RPC = {
  // mainnet
  1:       "https://ethereum-rpc.publicnode.com",
  143:     "https://rpc.monad.xyz",
  2741:    "https://api.mainnet.abs.xyz",

  // CORS preflight must pass AND the endpoint must answer a BATCHED eth_call, which several
  // otherwise-open public endpoints refuse. drpc (1923) answers the preflight by echoing the
  // caller's Origin rather than sending `*`; that is still valid CORS, and it was checked for
  // `Origin: null` too, so the page also works opened straight off disk.
  56:      "https://bsc-rpc.publicnode.com",
  130:     "https://unichain-rpc.publicnode.com",

  421614:    "https://arbitrum-sepolia-rpc.publicnode.com",
  11155420:  "https://optimism-sepolia-rpc.publicnode.com",
  59141:     "https://linea-sepolia-rpc.publicnode.com",
  17000:     "https://ethereum-holesky-rpc.publicnode.com",
};
const EXPLORER = {
  1:"https://etherscan.io/address/", 10:"https://optimistic.etherscan.io/address/",
  8453:"https://basescan.org/address/", 42161:"https://arbiscan.io/address/",
  59144:"https://lineascan.build/address/", 5000:"https://mantlescan.xyz/address/",
  143:"https://monadexplorer.com/address/", 2741:"https://abscan.org/address/",
  9745:"https://plasmascan.to/address/", 16661:"https://chainscan.0g.ai/address/",
  57073:"https://explorer.inkonchain.com/address/", 200901:"https://www.btrscan.com/address/",
  4326:"https://www.megaexplorer.xyz/address/",
  56:"https://bscscan.com/address/", 130:"https://uniscan.xyz/address/",
  137:"https://polygonscan.com/address/", 324:"https://explorer.zksync.io/address/",
  1135:"https://blockscout.lisk.com/address/", 1868:"https://soneium.blockscout.com/address/",
  1923:"https://explorer.swellnetwork.io/address/", 34443:"https://explorer.mode.network/address/",
  48900:"https://explorer.zircuit.com/address/", 534352:"https://scrollscan.com/address/",
  11155111:"https://sepolia.etherscan.io/address/", 5003:"https://sepolia.mantlescan.xyz/address/",

// Build inputs: this checkout's ledger and a single upstream main revision.
const BUILD = JSON.parse(document.getElementById("dashboard-data").textContent);
if (!BUILD.live) {
  document.getElementById("views").textContent = "Build the dashboard first: run just dashboard from the repository root.";
  throw new Error("Missing dashboard build data; run python3 scripts/build_dashboard.py");
}
const LIDO_SNAPSHOT = BUILD.provenance;
const LIDO_NETWORKS = BUILD.networks;
const L1_WSTETH = BUILD.l1Token;
const STETH_USD_FEED = "0xCfE54B5cD566aB89272946F602D76Ea879CAb4a8";
const LIVE = BUILD.live;

  unclassified: { label: "Ledger deployments · support unclassified", eyebrow: "unclassified", tone: "c-mute", note: "Present in the ledger; support status and bridge metadata have not been classified." },

    label: "Not endorsed — deployed over CCIP",
    eyebrow: "ccip",
    tone: "c-cl",

const isLiveLane = (a, b) => {
  const [x, y] = LIVE.lane.map(String);
  a = String(a); b = String(b);
  return (a === x && b === y) || (a === y && b === x);

const oursOn = (chainId) => new Set((LIVE.seeds[String(chainId)] || []).map(([a]) => a.toLowerCase()));

// ─────────────────────────────────────────────────────────────────────────────
// 2. State
// ─────────────────────────────────────────────────────────────────────────────

const state = Object.assign({

// The active tab chooses its network; saved environment selections are obsolete.
state.env = "mainnet";
const save = () => localStorage.setItem(LS, JSON.stringify({
  env: state.env, rpc: state.rpc, lanes: state.lanes,

// ─────────────────────────────────────────────────────────────────────────────
// 4. Chainlink registry

// The cacheable half: which contracts exist and at what versions. One multi-round crawl.
async function crawlStructure(env, chainId, peerId) {
  const entry = registry[env].chains[String(chainId)];
  const url = rpcFor(chainId);
  const res = { chainId: String(chainId), url, at: Date.now(), contracts: [], nocode: [], hidden: 0,
                error: null, ms: 0, rows: [], ramps: [] };
  if (!entry) { res.error = `chain ${chainId} is not in the ${env} registry`; return res; }
  if (!url)   { res.error = "no RPC configured — see the settings tab"; return res; }

  const via = new Map();                      // addr -> Set(provenance)
  const seen = new Set();

    if (!a) return;

    if (!seen.has(a)) queue.push(a);

       ["tokenPoolFactory", "registry:tokenPoolFactory"]]) {
    if (entry[k]) { add(entry[k], src); apiSeeded.add(entry[k].toLowerCase()); }
  }

  for (const r of res.ramps) {
    if (isLegacyRamp(r.ver)) continue;
    add(r.addr, `lanes:${r.kind}`); apiSeeded.add(r.addr);
  }
  const oursAddrs = oursOn(chainId);
  if (env === LIVE.env) {
    for (const [addr, src] of (LIVE.seeds[String(chainId)] || [])) {
      add(addr, src); apiSeeded.add(addr.toLowerCase());
    }

      queue = [];

      batch.forEach((a) => seen.add(a));

      // an OnRamp's bytecode is 48 KB per call, and for everything else typeAndVersion itself
      // answers "is this a contract": unnamed addresses are hidden from the table anyway.
      const needCode = batch.filter((a) => apiSeeded.has(a));

        if (!isSystemType(c.type)) continue;
        for (const p of probesFor(c.type)) probes.push({ c, p });
      }
      if (!probes.length) continue;
      const outs = await rpc(url, probes.map(({ c, p }) => call(c.addr, SEL[p])));
      probes.forEach(({ c, p }, i) => {
        for (const w of addrWords(outs[i])) add(w, `${c.type}${c.ver ? " " + c.ver : ""} · ${p}`);

      else if (src.some((s) => /(FeeQuoter|PriceRegistry).*getStaticConfig/.test(s))) type = `FeeToken (${type.slice(6)})`;

  }

  // one address can show up twice (say, as both onRamp and offRamp) — collapse it

  delete res.contracts;                       // raw crawl leftovers do not need to be cached
  return res;
}

// The live half: one batched round-trip. Block height, RMN curse, per-lane message counters.
async function probeLive(url, st, peerSel) {
  const out = { block: null, cursed: null, counters: {}, ms: 0, liveError: null };
  if (!url || !st.rows.length) return out;
  const armProxy = st.rows.find((r) => /^(ARMProxy|RMNProxy)/.test(r.type));
  const onRamps = st.rows.filter((r) => /^(OnRamp|EVM2EVMOnRamp)/.test(r.type));
  const calls = [{ method: "eth_blockNumber", params: [] }];
  if (armProxy) calls.push(call(armProxy.addr, SEL.isCursed));
  const counterOf = [];
  if (peerSel) for (const o of onRamps) {
    counterOf.push(o);
    calls.push(call(o.addr, SEL.getExpectedNextMessageNumber + u64arg(peerSel)));
    calls.push(call(o.addr, SEL.getExpectedNextSequenceNumber + u64arg(peerSel)));
  }
  const t0 = performance.now();
  try {
    const lr = await rpc(url, calls);
    out.block = lr[0] ? Number(BigInt(lr[0])) : null;
    let k = 1;
    if (armProxy) out.cursed = decBool(lr[k++]);
    for (const o of counterOf) {
      const a = decUint(lr[k++]), b = decUint(lr[k++]);
      const v = a !== null ? a : b;
      // string, not BigInt: this object gets JSON.stringify'd into the cache
      if (v !== null) out.counters[o.addr] = { type: o.type, ver: o.ver, next: v.toString() };
    }
  } catch (e) { out.liveError = e.message; }
  out.ms = Math.round(performance.now() - t0);
  return out;
}

// An address that answered nothing is indistinguishable from one whose typeAndVersion() simply
// reverted, and a throttled RPC produces exactly that: rows typed "unknown". Caching such a run
// would freeze a half-read chain in place until someone hits refresh, so it is refused.
const cacheable = (st) => !st.error && st.rows.length && !st.rows.some((r) => r.type === "unknown");

// Serves the cache when there is one. Reads from the chain only when there is nothing cached for
// this chain+peer, or when `force` (the refresh button) says to.
async function crawl(env, chainId, peerId, force) {
  const entry = registry[env].chains[String(chainId)];
  const url = rpcFor(chainId);
  const key = `${env}|${chainId}|${peerId || ""}`;
  let st = force ? null : structCache.get(key);
  if (st && st.url !== url) st = null;        // another endpoint may be another deployment
  let live = st ? st.live : null;
  let ms = 0;

  if (!st) {
    st = await crawlStructure(env, chainId, peerId);
    ms += st.ms;
    live = null;                              // a new structure needs its own live reading
  }
  if (!live) {
    const peerSel = peerId && registry[env].chains[String(peerId)]
      ? registry[env].chains[String(peerId)].selector : null;
    live = await probeLive(url, st, peerSel);
    live.at = Date.now();
    ms += live.ms;
    if (cacheable(st)) { st.live = live; structCache.set(key, st); saveCache(); }
  }

  const res = { ...live, entry, chainId: String(chainId), url, rows: st.rows, ramps: st.ramps,
                hidden: st.hidden, nocode: st.nocode,
                structAt: st.at, liveAt: live.at || null, latency: ms || null,
                error: st.error || live.liveError };
  res.checks = buildChecks(res, entry);
  noteDataAge(res.liveAt);
  return res;
}

function buildChecks(res, entry) {
  const out = [];
  entry = entry || {};   // chain absent from the registry: keep the checks empty, do not throw
  const find = (a) => res.rows.find((r) => eq(r.addr, a));
  const arm = res.rows.find((r) => /^(ARMProxy|RMNProxy)/.test(r.type));
  if (arm && entry.rmn) out.push(eq(arm.addr, entry.rmn)
    ? { s: "ok", t: "router.getArmProxy() matches registry.rmn" }
    : { s: "bad", t: `ARMProxy on chain is ${short(arm.addr)}, registry says ${short(entry.rmn)}` });
  for (const k of ["router", "rmn", "registryModule", "tokenAdminRegistry", "tokenPoolFactory"]) {
    if (entry[k] && res.nocode.includes(entry[k].toLowerCase()))
      out.push({ s: "bad", t: `registry.${k} = ${short(entry[k])} has no bytecode on this RPC` });
  }
  const seenRamp = new Set();
  for (const r of res.ramps) {
    if (isLegacyRamp(r.ver) || seenRamp.has(r.addr + r.kind)) continue;
    seenRamp.add(r.addr + r.kind);
    const row = find(r.addr);
    if (!row) out.push({ s: "bad", t: `${r.kind} ${short(r.addr)} from the API was not found on chain` });
    else if (row.ver !== r.ver) out.push({ s: "warn", t: `${r.kind} ${short(r.addr)}: API says ${r.ver}, the chain says ${row.type} ${row.ver}` });
    else out.push({ s: "ok", t: `${r.kind} ${short(r.addr)} = ${row.type} ${row.ver}` });
  }
  if (res.cursed === true) out.unshift({ s: "bad", t: "RMN: chain is cursed (isCursed = true) — lanes are frozen" });
  else if (res.cursed === false) out.push({ s: "ok", t: "RMN: not cursed (isCursed = false)" });
  if (res.hidden) out.push({ s: "mute", t: `${res.hidden} address(es) hidden: token pools, plus everything that did not answer typeAndVersion — fee aggregators, admins, peer-chain ramps read out of lane configs` });
  const oursN = (res.rows || []).filter((r) => r.ours).length;
  if (oursN) out.push({ s: "mute", t: `${oursN} testnet ${LIVE.deployedAt} contract(s) overlaid from ${LIVE.record} — not in Chainlink's registry` });
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// 7. Render
// ─────────────────────────────────────────────────────────────────────────────
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (id) => document.getElementById(id);
const views = el("views");
const tabStatus = new Map();

function addrCell(chainId, a, label) {
  if (!a) return '<span class="muted">—</span>';
  const ex = EXPLORER[String(chainId)];
  const txt = esc(label || a);
  // Addresses on the token tab come from the registry API, not from our own decoding — escape them
  // rather than trusting an external service to only ever hand back clean hex.
  const link = ex ? `<a class="addr" href="${esc(ex + a)}" target="_blank" rel="noopener">${txt}</a>`
                  : `<span class="addr">${txt}</span>`;
  return `${link} <button class="copy" data-copy="${esc(a)}" title="copy">⧉</button>`;
}
const chipFor = (s) => ({ ok: "c-ok", bad: "c-bad", warn: "c-warn", mute: "c-mute" }[s] || "c-mute");
const markFor = (s) => ({ ok: "✓", bad: "✗", warn: "⚠", mute: "·" }[s] || "·");

function chainHeader(res) {
  const e = res.entry || {};
  const age = res.block ? `block <b>${res.block.toLocaleString("en-US")}</b>` : "";
  const chips = [];
  if (res.cursed === true)  chips.push('<span class="chip c-bad"><span class="dot"></span>RMN: cursed</span>');
  if (res.cursed === false) chips.push('<span class="chip c-ok live"><span class="dot"></span>RMN: ok</span>');
  if (res.latency) chips.push(`<span class="chip c-mute">read in ${res.latency} ms</span>`);
  if (differsFromBoard(res.liveAt)) chips.push(`<span class="chip ${Date.now() - res.liveAt < 5000 ? "c-cl" : "c-mute"}"
      title="press refresh to re-read this chain">read ${esc(minuteTime(res.liveAt))}</span>`);
  return `
    <div class="card-head">
      <span class="eyebrow">${esc(e.displayName || res.chainId)}</span>
      ${chips.join(" ")}
    </div>
    <div class="card-body">
      <dl class="kv">
        <dt>chain id</dt><dd class="mono">${esc(res.chainId)}</dd>
        <dt>selector</dt><dd class="mono">${esc(e.selector || "—")}</dd>
        <dt>fee tokens</dt><dd>${esc((e.feeTokens || []).join(", ") || "—")}</dd>
        <dt>rpc</dt><dd class="addr">${esc(res.url || "not configured")} ${age ? "· " + age : ""}</dd>
      </dl>
    </div>`;
}

function contractsTable(res) {
  if (res.error && !res.rows) return `<div class="banner">${esc(res.error)}</div>`;
  if (!res.rows || !res.rows.length) return '<div class="empty">nothing found</div>';
  const body = res.rows.map((r) => `
    <tr>
      <td class="t-name">${r.ours ? '<span class="chip c-ours">ours</span> ' : ""}${esc(r.type)}</td>
      <td class="t-ver">${esc(r.ver || "—")}</td>
      <td>${addrCell(res.chainId, r.addr, short(r.addr))}</td>
      <td class="t-ver">${r.lanes ? esc(r.lanes) : '<span class="muted">—</span>'}</td>
      <td class="t-via" title="${esc(r.src.join("\n"))}">${esc(r.src[0] || "")}${r.src.length > 1 ? ` +${r.src.length - 1}` : ""}</td>
    </tr>`).join("");
  return `<div class="tw"><table>
      <thead><tr><th>contract</th><th>version</th><th>address</th><th>lanes</th><th>discovered via</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

function checksList(res) {
  if (!res.checks || !res.checks.length) return "";
  return `<ul class="checks">${res.checks.map((c) =>
    `<li><span class="m" style="color:var(--${c.s === "mute" ? "ink-3" : c.s})">${markFor(c.s)}</span><span>${esc(c.t)}</span></li>`).join("")}</ul>`;
}

function sidePanel(res) {
  const err = res.error ? `<div class="banner">${esc(res.error)}</div>` : "";
  return `<section class="card">
    ${chainHeader(res)}
    ${err ? `<div class="card-body">${err}</div>` : ""}
    <div class="card-body flush">${contractsTable(res)}</div>
    <div class="card-body" style="border-top:1px solid var(--rule)">${checksList(res)}</div>
  </section>`;
}

// ── lane tab ─────────────────────────────────────────────────────────────────
// A lane carries dozens of tokens; the table needs the watched one plus a count, rest in title.
function tokensCell(tokens) {
  const t = tokens || [];
  if (!t.length) return '<span class="muted">—</span>';
  const hit = t.find((x) => x.toLowerCase() === String(state.token).toLowerCase());
  const rest = t.length - (hit ? 1 : 0);
  return `<span title="${esc(t.join(", "))}">${hit ? `<span class="chip c-cl">${esc(hit)}</span> ` : ""}${rest ? `+${rest} more` : ""}</span>`;
}

function laneSummary(env, a, b, ra, rb) {
  const nameOf = (id) => (registry[env].chains[String(id)] || {}).displayName || id;
  const rows = [];
  for (const [side, res, from, to] of [["A", ra, a, b], ["B", rb, b, a]]) {
    for (const r of (res.ramps || [])) {
      if (isLegacyRamp(r.ver)) continue;
      const row = (res.rows || []).find((x) => eq(x.addr, r.addr));
      const cnt = res.counters[r.addr];
      const ok = row && row.ver === r.ver;
      rows.push(`<tr>
        <td class="t-name">${esc(nameOf(from))} ${r.kind === "onRamp" ? "→" : "←"} ${esc(nameOf(to))}</td>
        <td class="t-ver">${r.kind}</td>
        <td class="t-ver">${esc(r.ver)}</td>
        <td class="t-ver">${row ? `<span class="chip ${ok ? "c-ok" : "c-warn"}">${esc(row.type)} ${esc(row.ver || "")}</span>`
                                : '<span class="chip c-bad">not on chain</span>'}</td>
        <td>${addrCell(from, r.addr, short(r.addr))}</td>
        <td class="t-ver">${cnt ? esc(cnt.next.toString()) : '<span class="muted">—</span>'}</td>
        <td class="t-via">${tokensCell(r.tokens)}</td>
      </tr>`);
    }
  }
  return `<section class="card">
    <div class="card-head">
      <span class="eyebrow">lane</span>
      <h2>${esc(env === "mainnet" ? liveViews().find((v) => v.id === `lane-${a}-${b}`)?.label || `${nameOf(a)} ↔ ${nameOf(b)}` : `${nameOf(a)} ↔ ${nameOf(b)}`)}</h2>
      <span class="stamp">${isLiveLane(a, b)
        ? `testnet v3 · deployed ${esc(LIVE.deployedAt)} · <a href="roles.html">roles ↗</a>`
        : "both ramps of an “A_to_B” entry live on A"}</span>
    </div>
    <div class="card-body flush"><div class="tw"><table>
      <thead><tr><th>direction</th><th>ramp</th><th>API version</th><th>typeAndVersion</th><th>address</th><th>next msg #</th><th>lane tokens</th></tr></thead>
      <tbody>${rows.join("") || '<tr><td colspan="7" class="muted">no ≥1.6 lanes between these chains</td></tr>'}</tbody>
    </table></div></div>
  </section>`;
}

async function viewLane(a, b, force) {
  const [ra, rb] = await Promise.all([crawl(state.env, a, b, force), crawl(state.env, b, a, force)]);
  const worst = [ra, rb].flatMap((r) => (r.checks || []).map((c) => c.s));
  tabStatus.set(`lane-${a}-${b}`, worst.includes("bad") || ra.error || rb.error ? "bad" : worst.includes("warn") ? "warn" : "ok");
  views.innerHTML = laneSummary(state.env, a, b, ra, rb) + `<div class="grid2">${sidePanel(ra)}${sidePanel(rb)}</div>`;
}

// ── overview tab ─────────────────────────────────────────────────────────────
// Where wstETH actually lives, grouped by who stands behind the deployment.
//
// Mainnet only, and it says so on the card: the env selector does not reach this tab.
//
// Loading is two-phase on purpose. ONE batched read of Ethereum settles every L1 escrow, the
// CCIP pool, its per-destination silos and the price — enough to paint the whole table at once.
// The per-network supplies then stream in from up to 24 other chains, each row filling itself
// as its chain answers. A row whose chain never answers says so; it never quietly reads zero.
const OV_KEY = "ov-l1|mainnet|v2";
const ovStr = (v) => (v === null || v === undefined ? null : v.toString());
const ovBig = (v) => (v === null || v === undefined ? null : BigInt(v));

// rows: the build-time ledger projection plus whatever the CCIP registry currently lists. The hub is
// not a destination, so it is dropped here and reported separately.
//
// A row is keyed by chain AND token, never by chain alone. One network can legitimately carry two
// wstETH deployments — a Lido bridge token and a separate CCIP burn/mint token — and this repo is
// building exactly that for Mantle, which is already in the legacy group. Keying by chain would
// then add one supply to the totals twice, and leave the second row's cells a skeleton forever,
// because a `[data-ov-amt="<chain>"]` selector matches only the first of them.
const rowKey = (chainId, token) => `${chainId}:${String(token).toLowerCase()}`;

function overviewRows() {
  const rows = LIDO_NETWORKS.map((n) => ({
    ...n, chainId: String(n.chainId), selector: null, key: rowKey(n.chainId, n.token),
  }));
  const byChain = ((registry.mainnet || {}).tokens || {}).wstETH || {};
  const chains = (registry.mainnet || {}).chains || {};
  for (const info of Object.values(byChain)) {
    const id = String(info.chainId);
    if (id === "1") continue;
    if (rows.some((r) => r.key === rowKey(id, info.tokenAddress))) continue;
    rows.push({
      chainId: id, name: info.chainName, group: "ccip", bridge: "CCIP burn/mint",
      token: info.tokenAddress, escrow: null, escrowLabel: null,
      selector: (chains[id] || {}).selector || null,
      src: { token: "ccip registry", escrow: null },
      key: rowKey(id, info.tokenAddress),
    });
  }
  return rows;
}

// Everything Ethereum can answer about the whole picture, in one batch.
async function overviewL1(rows, force) {
  const url = rpcFor(1);
  const hub = (((registry.mainnet || {}).tokens || {}).wstETH || {})["1"] || null;
  const out = { url, at: null, err: null, price: null, rate: null, supply: null,
                escrow: {}, silo: {}, pool: { addr: hub ? hub.poolAddress : null, held: null, unsiloed: null } };
  if (!url) { out.err = "no RPC configured for Ethereum"; return out; }

  let c = force ? null : metaCache.get(OV_KEY);
  if (c && c.url !== url) c = null;
  if (c) {
    out.at = c.at; out.price = ovBig(c.price); out.rate = ovBig(c.rate); out.supply = ovBig(c.supply);
    for (const [k, v] of Object.entries(c.escrow)) out.escrow[k] = ovBig(v);
    for (const [k, v] of Object.entries(c.silo)) out.silo[k] = { siloed: v.siloed, available: ovBig(v.available) };
    out.pool.held = ovBig(c.pool.held); out.pool.unsiloed = ovBig(c.pool.unsiloed);
    return out;
  }

  const escrows = rows.filter((r) => r.escrow);
  const spokes = rows.filter((r) => r.group === "ccip" && r.selector);
  const calls = [
    call(L1_WSTETH, SEL.totalSupply),
    call(L1_WSTETH, SEL.stEthPerToken),
    call(STETH_USD_FEED, SEL.latestAnswer),
    ...escrows.map((r) => call(L1_WSTETH, SEL.balanceOf + addrArg(r.escrow))),
  ];
  if (out.pool.addr) {
    calls.push(call(L1_WSTETH, SEL.balanceOf + addrArg(out.pool.addr)),
               call(out.pool.addr, SEL.getUnsiloedLiquidity));
    for (const s of spokes) {
      calls.push(call(out.pool.addr, SEL.isSiloed + u64arg(s.selector)),
                 call(out.pool.addr, SEL.getAvailableTokens + u64arg(s.selector)));
    }
  }

  try {
    const r = await rpc(url, calls);
    let k = 0;
    out.supply = decUint(r[k++]);
    out.rate = decUint(r[k++]);
    out.price = decUint(r[k++]);
    for (const e of escrows) out.escrow[e.key] = decUint(r[k++]);
    if (out.pool.addr) {
      out.pool.held = decUint(r[k++]);
      out.pool.unsiloed = decUint(r[k++]);
      for (const s of spokes) {
        const siloed = decBool(r[k++]), available = decUint(r[k++]);
        out.silo[s.key] = { siloed, available };
      }
    }
    out.at = Date.now();
    metaCache.set(OV_KEY, {
      url, at: out.at, price: ovStr(out.price), rate: ovStr(out.rate), supply: ovStr(out.supply),
      escrow: Object.fromEntries(Object.entries(out.escrow).map(([a, b]) => [a, ovStr(b)])),
      silo: Object.fromEntries(Object.entries(out.silo).map(([a, b]) => [a, { siloed: b.siloed, available: ovStr(b.available) }])),
      pool: { held: ovStr(out.pool.held), unsiloed: ovStr(out.pool.unsiloed) },
    });
    saveCache();
  } catch (e) { out.err = e.message; }
  return out;
}

// One network's own wstETH supply. Cached next to everything else, keyed by the RPC that
// produced it so pointing a chain at a different endpoint drops the old figure.
async function overviewSupply(row, force) {
  const url = rpcFor(row.chainId);
  if (!url) return { v: null, at: null, err: "no RPC" };
  const key = `ov|${row.chainId}|${row.token.toLowerCase()}`;
  let c = force ? null : metaCache.get(key);
  if (c && c.url !== url) c = null;
  if (c) return { v: ovBig(c.supply), at: c.at, err: null };
  try {
    const r = await rpc(url, [call(row.token, SEL.totalSupply)]);
    const v = decUint(r[0]);
    if (v === null) return { v: null, at: null, err: "no answer" };
    const at = Date.now();
    metaCache.set(key, { url, at, supply: ovStr(v) });
    saveCache();
    return { v, at, err: null };
  } catch (e) { return { v: null, at: null, err: e.message }; }
}

// ── overview: numbers ────────────────────────────────────────────────────────
// Live view state. `epoch` guards against a fill from a previous render landing in a table
// that is no longer on screen.
const ov = { epoch: 0, rows: [], l1: null, supply: new Map() };

const ovUsd = (amount) => {
  if (amount === null || !ov.l1 || ov.l1.rate === null || ov.l1.price === null) return null;
  return (amount * ov.l1.rate / 10n ** 18n) * ov.l1.price / 10n ** 8n;
};
// 0.01% resolution, which is as fine as the share column is ever read.
const ovPct = (part, whole) => (whole && whole > 0n ? Number(part * 10000n / whole) / 100 : null);

// What the L1 side says backs a given row. For a CCIP spoke that is only answerable when the
// destination is siloed — the unsiloed liquidity is one pot shared by all the unsiloed spokes,
// so attributing a slice of it to any one network would be an invention.
function ovBacking(row) {
  if (!ov.l1) return { v: null, kind: "none" };
  if (row.group !== "ccip") return { v: ov.l1.escrow[row.key] ?? null, kind: "escrow" };
  const s = ov.l1.silo[row.key];
  if (!s) return { v: null, kind: "none" };
  if (s.siloed === null) return { v: null, kind: "none" };
  return s.siloed ? { v: s.available, kind: "silo" } : { v: null, kind: "pooled" };
}

// State the custody model independently from the amount. In particular, an unsiloed CCIP lane
// has real L1 backing, but no honest per-network share of the common pot can be reported.
function ovLiquidityModel(row) {
  if (row.group !== "ccip") {
    return '<span class="chip c-mute">dedicated</span><div class="muted" style="font-size:var(--fs-xs)">separate escrow</div>';
  }
  const s = ov.l1 && ov.l1.silo[row.key];
  if (!s || s.siloed === null) return '<span class="chip c-warn">unread</span>';
  return s.siloed
    ? '<span class="chip c-ok">siloed</span><div class="muted" style="font-size:var(--fs-xs)">isolated lane balance</div>'
    : '<span class="chip c-cl">unsiloed</span><div class="muted" style="font-size:var(--fs-xs)">shared pool balance</div>';
}

function ovL1HolderCell(row) {
  if (row.escrow) {
    return `${addrCell("1", row.escrow, short(row.escrow))} ${ovSrcChip(row.src.escrow)}${
      row.escrowLabel ? `<div class="muted" style="font-size:var(--fs-xs)">${esc(row.escrowLabel)}</div>` : ""}`;
  }
  const pool = row.group === "ccip" && ov.l1 ? ov.l1.pool.addr : null;
  return pool
    ? `${addrCell("1", pool, short(pool))}<div class="muted" style="font-size:var(--fs-xs)">one pool · all CCIP lanes</div>`
    : '<span class="muted">—</span>';
}

function ovTotals() {
  const t = { all: 0n, read: 0, missing: 0, group: {} };
  for (const g of Object.keys(GROUPS)) t.group[g] = { sum: 0n, read: 0, total: 0 };
  for (const r of ov.rows) {
    const g = t.group[r.group];
    g.total++;
    const s = ov.supply.get(r.key);
    if (s && s.v !== null) { t.all += s.v; t.read++; g.sum += s.v; g.read++; }
    else if (s) t.missing++;
  }
  return t;
}

// The L1 side of one row, and what it says about the L2 side once that has arrived. The two
// figures are read seconds and a bridge apart, so they are never expected to match to the wei;
// Display the signed difference without assigning a cause. Independent read blocks and
// bridge accounting need investigation before interpreting either sign.
function ovL1Cell(row, s) {
  const back = ovBacking(row);
  if (back.kind === "pooled") {
    return `<span class="muted" title="this destination is not siloed: its backing sits in the pool's shared unsiloed liquidity, and no single network can claim a slice of that">in shared pool</span>`;
  }
  if (back.v === null) return '<span class="muted">—</span>';
  const head = fmtUnits(back.v, 18, 2);
  const tag = back.kind === "silo" ? '<div class="muted" style="font-size:var(--fs-xs)">siloed</div>' : "";
  if (!s || s.v === null) return head + tag;
  const d = back.v - s.v;
  const sub = (html) => `${head}${tag}<div class="muted" style="font-size:var(--fs-xs)">${html}</div>`;
  const material = back.v > 0n ? (d < 0n ? -d : d) * 1000n > back.v : d !== 0n;   // > 0.1%
  if (!material) return sub("within 0.1% of L1 balance");
  if (d > 0n) return sub(`L1 exceeds supply by ${fmtUnits(d, 18, 2)}`);
  return `${head}${tag}<div style="font-size:var(--fs-xs)"><span class="chip c-bad">${fmtUnits(-d, 18, 2)} over escrow</span></div>`;
}

// Patch only the cells that carry numbers. A fill must not rewrite the table: that would drop
// scroll position and hover, 24 times over.
const minuteTime = (at) => new Date(at).toISOString().slice(0, 16).replace("T", " ") + " UTC";
const differsFromBoard = (at) => at != null && dataAt != null && Math.abs(at - dataAt) > 120000;
function readTime(at) {
  if (!differsFromBoard(at)) return "";
  return `<div class="muted" style="font-size:var(--fs-xs)">read <time datetime="${esc(new Date(at).toISOString())}">${esc(minuteTime(at))}</time></div>`;
}

function ovPaintNumbers() {
  const t = ovTotals();
  const dec = 18;
  tabStatus.set("overview", t.read === ov.rows.length && ov.l1 && !ov.l1.err
    && ov.rows.every((r) => { const b = ovBacking(r); return b.kind === "pooled" || b.v !== null; }) ? "ok" : "warn");
  for (const r of ov.rows) {
    const s = ov.supply.get(r.key);
    const amt = document.querySelector(`[data-ov-amt="${r.key}"]`);
    if (amt) {
      if (!s) amt.innerHTML = '<span class="skel"></span>';
      else if (s.v === null) amt.innerHTML = `<span class="chip c-warn">${esc(s.err || "unread")}</span>`;
      else {
        const usd = ovUsd(s.v);
        amt.innerHTML = `<b>${fmtUnits(s.v, dec, 2)}</b>${
          usd === null ? "" : `<div class="muted" style="font-size:var(--fs-xs)">$${fmtUnits(usd, dec, 0)}</div>`}`;
      }
    }
    if (amt && s?.at) amt.innerHTML += readTime(s.at);
    const l1 = document.querySelector(`[data-ov-l1="${r.key}"]`);
    if (l1) l1.innerHTML = ovL1Cell(r, s) + (ov.l1?.at ? readTime(ov.l1.at) : "");
    const sh = document.querySelector(`[data-ov-share="${r.key}"]`);
    if (sh) {
      const p = s && s.v !== null ? ovPct(s.v, t.all) : null;
      sh.innerHTML = p === null ? '<span class="muted">—</span>'
        : `<span class="ovbar"><i style="width:${Math.min(100, p).toFixed(2)}%"></i></span><span class="ovpct">${p.toFixed(2)}%</span>`;
    }
  }
  for (const [g, agg] of Object.entries(t.group)) {
    const el2 = document.querySelector(`[data-ov-sub="${g}"]`);
    if (!el2) continue;
    const p = ovPct(agg.sum, t.all);
    el2.innerHTML = `<b>${fmtUnits(agg.sum, dec, 2)}</b> wstETH${p === null ? "" : ` · ${p.toFixed(2)}%`}${
      agg.read < agg.total ? ` · <span class="muted">${agg.read}/${agg.total} networks read</span>` : ""}`;
  }
  const tot = document.querySelector("[data-ov-total]");
  if (tot) {
    const usd = ovUsd(t.all);
    tot.innerHTML = `<span class="chip c-cl">${t.read === ov.rows.length ? "supply on listed networks" : "partial supply · networks read"}
        <b style="margin-left:4px">${fmtUnits(t.all, dec, 2)}</b></span>
      ${usd === null ? "" : `<span class="chip c-cl" title="Estimate: stEthPerToken() × Chainlink STETH/USD">≈ <b style="margin-left:4px">$${fmtUnits(usd, dec, 0)}</b></span>`}
      ${ov.l1 && ov.l1.supply !== null
        ? `<span class="chip c-mute">of ${fmtUnits(ov.l1.supply, dec, 0)} wstETH on Ethereum</span>` : ""}
      <span class="chip ${t.read === ov.rows.length ? "c-ok" : "c-warn"}">${t.read}/${ov.rows.length} networks read</span>`;
  }
}

// ── overview: render ─────────────────────────────────────────────────────────
function ovSrcChip(kind) {
  if (!kind) return "";
  const tone = kind === "ledger" ? "c-ok" : kind === "docs" ? "c-warn" : "c-cl";
  return `<span class="chip ${tone}" style="font-size:9px; padding:1px 5px">${esc(kind)}</span>`;
}

// The five descriptive columns, in group-dependent order. On the CCIP card the liquidity model
// is the discriminator that explains why "locked on L1" reads "in shared pool" for most rows, so
// it leads, right after the network it qualifies. On the other two cards it is the constant
// "dedicated" for every row, so it stays where it was, beside the L1 holder it describes.
// Head and body read the same order from one place; they cannot drift apart.
function overviewNetworkName(row) {
  const lane = (state.lanes.mainnet || []).find(([a, b]) =>
    (String(a) === "1" && String(b) === row.chainId) ||
    (String(b) === "1" && String(a) === row.chainId));
  return lane
    ? `<a href="#lane-${esc(lane[0])}-${esc(lane[1])}">${esc(row.name)}</a>`
    : esc(row.name);
}

const OV_COLS = {
  name:   { th: "network", td: (r) => `<td class="t-name">${overviewNetworkName(r)}<br><span class="muted mono" style="font-size:var(--fs-xs)">${esc(r.chainId)}</span></td>` },
  model:  { th: "L1 liquidity model", td: (r) => `<td>${ovLiquidityModel(r)}</td>` },
  via:    { th: "how it gets there", td: (r) => `<td class="t-via" style="white-space:normal; max-width:190px">${esc(r.bridge)}</td>` },
  token:  { th: "network token", td: (r) => `<td>${addrCell(r.chainId, r.token, short(r.token))} ${ovSrcChip(r.src.token)}</td>` },
  holder: { th: "L1 holder", td: (r) => `<td>${ovL1HolderCell(r)}</td>` },
};
const ovColOrder = (group) => (group === "ccip"
  ? ["name", "model", "via", "token", "holder"]
  : ["name", "via", "token", "holder", "model"]).map((k) => OV_COLS[k]);

function ovGroupCard(group, rows) {
  const g = GROUPS[group];
  const cols = ovColOrder(group);
  const body = rows.map((r) => `<tr>
      ${cols.map((c) => c.td(r)).join("\n      ")}
      <td class="ovnum" data-ov-amt="${esc(r.key)}"><span class="skel"></span></td>
      <td class="ovnum" data-ov-l1="${esc(r.key)}"></td>
      <td class="ovshare" data-ov-share="${esc(r.key)}"><span class="muted">—</span></td>
    </tr>`).join("");
  return `<section class="card">
    <div class="card-head">
      <span class="eyebrow">${esc(g.eyebrow)}</span>
      <h2>${esc(g.label)}</h2>
      <span class="chip ${g.tone}">${rows.length} network${rows.length === 1 ? "" : "s"}</span>
      <span class="stamp" data-ov-sub="${esc(group)}"></span>
    </div>
    <div class="card-body" style="padding-bottom:var(--sp-3)">
      <p class="muted" style="margin:0; font-size:var(--fs-sm)">${g.note}</p>
    </div>
    <div class="card-body flush"><div class="tw"><table>
      <thead><tr>
        ${cols.map((c) => `<th>${c.th}</th>`).join("")}
        <th style="text-align:right">on network</th><th style="text-align:right">locked on L1</th><th title="Share of successfully read supply">share</th>
      </tr></thead>
      <tbody>${body || `<tr><td colspan="${cols.length + 3}" class="muted">none</td></tr>`}</tbody>
    </table></div></div>
  </section>`;
}

async function viewOverview(force) {
  await loadRegistry("mainnet", force);
  const epoch = ++ov.epoch;
  ov.rows = overviewRows();
  ov.supply = new Map();
  ov.l1 = await overviewL1(ov.rows, force);
  noteDataAge(ov.l1.at);
  tabStatus.set("overview", ov.l1.err ? "bad" : "ok");

  const pool = ov.l1.pool;
  const ccipRows = ov.rows.filter((r) => r.group === "ccip");
  const siloedRows = ccipRows.filter((r) => ov.l1.silo[r.key]?.siloed === true);
  const unsiloedRows = ccipRows.filter((r) => ov.l1.silo[r.key]?.siloed === false);
  const unreadSiloRows = ccipRows.filter((r) => ov.l1.silo[r.key]?.siloed == null);
  const siloedSum = Object.values(ov.l1.silo).reduce(
    (s, x) => s + (x.siloed === true && x.available !== null ? x.available : 0n), 0n);
  // Compare only when all listed balances were read. A mismatch may reflect read blocks
  // or incomplete registry coverage; the arithmetic alone does not identify its cause.
  const poolComplete = ccipRows.length > 0 && unreadSiloRows.length === 0
    && siloedRows.every((r) => ov.l1.silo[r.key].available !== null)
    && pool.held !== null && pool.unsiloed !== null;
  const poolOk = poolComplete && pool.held === pool.unsiloed + siloedSum;

  views.innerHTML = `
    <section class="card">
      <div class="card-head">
        <span class="eyebrow">overview</span>
        <h2>wstETH across mainnets</h2>
        <span class="stamp">mainnet</span>
      </div>
      <div class="card-body">
        ${ov.l1.err ? `<div class="banner">${esc(ov.l1.err)}</div>` : ""}
        <div class="strip" data-ov-total></div>
        <p class="muted" style="margin:var(--sp-3) 0 0; font-size:var(--fs-sm)">
          Network supply vs. Ethereum backing. Reads may be from different blocks.
        </p>
      </div>
    </section>

    ${ovGroupCard("supported", ov.rows.filter((r) => r.group === "supported"))}
    ${ovGroupCard("ccip", ov.rows.filter((r) => r.group === "ccip"))}

    <section class="card">
      <div class="card-head">
        <span class="eyebrow">ccip pool</span>
        <h2>Why most CCIP rows have no L1 figure</h2>
        <span class="stamp">${pool.addr ? addrCell("1", pool.addr, short(pool.addr)) : "—"}</span>
      </div>
      <div class="card-body">
        <p class="muted" style="margin:0 0 var(--sp-3); font-size:var(--fs-sm)">
          Shared L1 liquidity has no per-network balance; siloed lanes do.
        </p>
        <div class="strip">
          <span class="chip c-cl">pool holds <b style="margin-left:4px">${fmtUnits(pool.held, 18, 2)}</b></span>
          <span class="chip c-cl">unsiloed <b style="margin-left:4px">${fmtUnits(pool.unsiloed, 18, 2)}</b></span>
          <span class="chip c-cl">known silo balances <b style="margin-left:4px">${fmtUnits(siloedSum, 18, 2)}</b></span>
          <span class="chip c-ok">${siloedRows.length} isolated lane${siloedRows.length === 1 ? "" : "s"}</span>
          <span class="chip c-cl">${unsiloedRows.length} shared lane${unsiloedRows.length === 1 ? "" : "s"}</span>
          ${unreadSiloRows.length ? `<span class="chip c-warn">${unreadSiloRows.length} status unread</span>` : ""}
          <span class="chip ${poolOk ? "c-ok" : "c-warn"}">${
            poolOk ? "listed silos + unsiloed = pool balance" : poolComplete
              ? "listed balances differ · check read blocks and lane coverage" : "reconciliation unavailable · incomplete reads"}</span>
        </div>
        <div class="grid2" style="margin-top:var(--sp-3)">
          <div class="kv"><dt>siloed</dt><dd>${siloedRows.length
            ? siloedRows.map((r) => esc(r.name)).join(" · ") : '<span class="muted">none</span>'}</dd></div>
          <div class="kv"><dt>unsiloed</dt><dd>${unsiloedRows.length
            ? unsiloedRows.map((r) => esc(r.name)).join(" · ") : '<span class="muted">none</span>'}</dd></div>
        </div>
      </div>
    </section>

    ${ovGroupCard("legacy", ov.rows.filter((r) => r.group === "legacy"))}
    ${ov.rows.some((r) => r.group === "unclassified") ? ovGroupCard("unclassified", ov.rows.filter((r) => r.group === "unclassified")) : ""}

    <section class="card">
      <div class="card-head"><span class="eyebrow">provenance</span><h2>Where each column comes from</h2></div>
      <div class="card-body">
        <ul class="checks" style="margin:0">
          <li><span class="m">·</span><span>Cached RPC reads. Row times appear only if >2 min from the board time.</span></li>
          <li><span class="m">·</span><span>Groups: <a href="${esc(LIDO_SNAPSHOT.docsUrl)}" target="_blank" rel="noopener">Lido docs</a> snapshot · ${esc(LIDO_SNAPSHOT.takenAt)}.</span></li>
          <li><span class="m">·</span><span>Addresses: <a href="${esc(LIDO_SNAPSHOT.ledgerUrl)}" target="_blank" rel="noopener">Lido ledger</a> · ${esc(LIDO_SNAPSHOT.ledgerUpdatedAt)}; docs or CCIP registry.</span></li>
          <li><span class="m">·</span><span>Missing RPC? Add an endpoint in settings ⚙.</span></li>
        </ul>
      </div>
    </section>`;

  ovPaintNumbers();

  // Phase two. Deliberately not awaited: the table is already usable, and one hung endpoint
  // must not hold the other 23 hostage.
  for (const r of ov.rows) {
    overviewSupply(r, force).then((s) => {
      if (ov.epoch !== epoch || currentView() !== "overview") return;             // the view moved on; this answer is stale
      ov.supply.set(r.key, s);
      noteDataAge(s.at);
      ovPaintNumbers();
      renderTabs(); tickStamp();
    });
  }
}

// ── settings tab ─────────────────────────────────────────────────────────────
function viewSettings() {
  const reg = registry[state.env] || { chains: {}, tokens: {} };
  // Lido's own networks are not in Chainlink's registry, so their names come from the snapshot.
  // "1" is spelled out because on testnet the registry has no mainnet chains to name it from,
  // and the overview reads Ethereum regardless of the selector.
  const lidoName = Object.fromEntries([["1", "Ethereum"], ...LIDO_NETWORKS.map((n) => [String(n.chainId), n.name])]);
  const nameOf = (id) => reg.chains[id]?.displayName ||
    ({ 11155111: "Sepolia", 5003: "Mantle Sepolia" })[id] || lidoName[id] || `chain ${id}`;
  const used = new Set(LIVE.lane.map(String));
  (state.lanes[state.env] || []).forEach(([a, b]) => { used.add(String(a)); used.add(String(b)); });
  const tok = reg.tokens.wstETH;
  if (tok) Object.keys(tok).forEach((k) => used.add(k));
  // The overview reads chains no other tab touches, and Lido's own networks are not in
  // Chainlink's registry, so without this they would have no row here and no way to override.
  used.add("1");
  Object.keys(lidoName).forEach((k) => used.add(k));
  const order = [...used].sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  const rows = order.map((id) => {
    const nm = nameOf(id);
    const v = state.rpc[id] || "";
    return `<div class="rpcrow">
      <span class="nm">${esc(nm)}<small>${esc(id)}</small></span>
      <input type="url" data-rpc="${esc(id)}" value="${esc(v)}" placeholder="${esc(DEFAULT_RPC[id] || "no RPC — paste a URL")}">
      <button class="btn" data-rpcclear="${esc(id)}">reset</button>
    </div>`;
  }).join("");
  const laneRows = (state.lanes[state.env] || []).map(([a, b], i) =>
    `<div class="rpcrow"><span class="nm">${esc(reg.chains[String(a)]?.displayName || a)} ↔ ${esc(reg.chains[String(b)]?.displayName || b)}</span>
      <span class="muted mono" style="font-size:var(--fs-xs)">${esc(a)} / ${esc(b)}</span>
      <button class="btn" data-lanedel="${i}">remove</button></div>`).join("");
  const chainOpts = Object.entries(reg.chains)
    .sort((x, y) => x[1].displayName.localeCompare(y[1].displayName))
    .map(([id, c]) => `<option value="${esc(id)}">${esc(c.displayName)} · ${esc(id)}</option>`).join("");
  views.innerHTML = `
    <section class="card">
      <div class="card-head"><span class="eyebrow">Live · mainnet lanes</span></div>
      <div class="card-body">
        ${laneRows || '<p class="muted">none yet</p>'}
        <div class="rpcrow" style="margin-top:var(--sp-3)">
          <select id="laneA">${chainOpts}</select>
          <select id="laneB">${chainOpts}</select>
          <button class="btn btn-primary" id="laneadd">add</button>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="card-head"><span class="eyebrow">cache</span>
        <span class="stamp">Cached until refresh; missing data is fetched on open.</span></div>
      <div class="card-body strip">
        <span class="chip c-mute">${structCache.size} chain inventor${structCache.size === 1 ? "y" : "ies"}</span>
        <span class="chip c-mute">${metaCache.size} pool record(s)</span>
        ${cacheAge() !== null ? `<span class="chip c-mute">oldest reading ${ago(cacheAge())}</span>` : ""}
        ${regAge(state.env) !== null ? `<span class="chip c-mute">registry ${ago(regAge(state.env))}</span>` : ""}
        <button class="btn" id="cacheclear">clear cache</button>
      </div>
    </section>
    <section class="card">
      <div class="card-head"><span class="eyebrow">RPC</span>
        <span class="stamp">empty = the built-in public endpoint shown as placeholder</span></div>
      <div class="card-body">${rows}</div>
    </section>`;
  tabStatus.set("settings", null);
}

// ── tabs and routing ─────────────────────────────────────────────────────────
function tabsModel() {
  return [{ id: "overview", label: "Live" },
    { id: `lane-${LIVE.lane[0]}-${LIVE.lane[1]}`, label: "Dev (testnet)" }];
}
function liveViews() {
  const t = [{ id: "overview", label: "Overview" }];
  for (const [a, b] of (state.lanes.mainnet || [])) {
    // "Ethereum Sepolia" -> "Sepolia", "MegaETH Mainnet" -> "MegaETH", but "Ethereum" stays itself
    const nm = (id) => String(registry.mainnet?.chains?.[String(id)]?.displayName || id)
      .replace(/\s+(Mainnet|Testnet)$/i, "").replace(/^Ethereum\s+(?=\S)/, "");
    t.push({ id: `lane-${a}-${b}`, label: String(a) === "1" ? nm(b) : String(b) === "1" ? nm(a) : `${nm(a)} ↔ ${nm(b)}` });
  }
  return t;
}
function renderTabs() {
  el("settings").classList.toggle("active", state.view === "settings");
  el("settings").setAttribute("aria-pressed", String(state.view === "settings"));
  el("tabs").innerHTML = tabsModel().map((t) => {
    const active = t.id === state.view || (t.id === "overview" && liveViews().some((v) => v.id === state.view));
    const s = busy && active ? "busy" : tabStatus.get(active ? state.view : t.id);
    return `<button class="tab${active ? " active" : ""}" data-tab="${esc(t.id)}">
      ${esc(t.label)}${s ? `<span class="tab-dot" data-s="${s}" role="img" aria-label="${s === "ok" ? "displayed checks passed" : s === "busy" ? "reading" : "incomplete reads or check issues"}" title="${s === "ok" ? "Displayed checks passed; not a bridge safety assessment" : s === "busy" ? "Reading" : "Incomplete reads or check issues"}"></span>` : ""}</button>`;
  }).join("");
}
function currentView() {
  const h = location.hash.replace(/^#/, "");
  const ids = [...tabsModel().map((t) => t.id), ...liveViews().map((t) => t.id), "settings"];
  return ids.includes(h) ? h : ids[0];
}

// ─────────────────────────────────────────────────────────────────────────────
// 8. Refresh cycle and events
// ─────────────────────────────────────────────────────────────────────────────

function setStamp(text) { el("stamp").textContent = text; }
// Refresh is manual only, so the header reports the age of the DATA, not of the last render.
function tickStamp() {
  if (busy) return setStamp("reading…");
  const age = dataAt ? `oldest read ${minuteTime(dataAt)}` : "—";
  setStamp(offline ? `${age} · offline copy` : age);
}

async function run() {
  if (busy) { runPending = true; return; }
  ++ov.epoch; // Ignore background supply reads from the previous view.
  const force = forceNext; forceNext = false;
  dataAt = null;
  busy = true; el("refresh").disabled = true; renderTabs(); tickStamp();
  try {
    state.view = currentView();
    state.env = state.view === `lane-${LIVE.lane[0]}-${LIVE.lane[1]}` ? LIVE.env : "mainnet";
    await loadRegistry(state.env, force);
    renderTabs();
    if (state.view === "overview") {
      await viewOverview(force);
    } else if (state.view === "settings") {
      viewSettings();
    } else {
      const [, a, b] = state.view.split("-");
      await viewLane(a, b, force);
      if (state.env === LIVE.env) {
        views.insertAdjacentHTML("afterbegin", '<p class="sub" style="margin-bottom:var(--sp-3)"><a href="roles.html">who may change it ↗</a></p>');
      }
    }
    if (state.env === "mainnet" && state.view.startsWith("lane-")) {
      views.insertAdjacentHTML("afterbegin", '<p class="sub" style="margin-bottom:var(--sp-3)"><a href="#overview">← Live overview</a></p>');
    }
  } catch (e) {
    views.innerHTML = `<div class="banner">${esc(e && e.message || e)}</div>`;
  } finally {
    busy = false; el("refresh").disabled = false; renderTabs(); tickStamp();
    if (runPending) { runPending = false; void run(); }
  }
}

function go(view) {
  if (location.hash.replace(/^#/, "") === view) run();
  else location.hash = view;                         // hashchange kicks off run()
}

// delegation: tabs
el("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab);
});
el("settings").addEventListener("click", () => go("settings"));
// delegation: tab contents
views.addEventListener("click", async (e) => {
  const view = e.target.closest("[data-view]");
  if (view) { go(view.dataset.view); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = "✓";
          setTimeout(() => (copy.textContent = "⧉"), 900); } catch {}
    return;
  }
  const del = e.target.closest("[data-lanedel]");
  if (del) { state.lanes[state.env].splice(Number(del.dataset.lanedel), 1); save(); renderTabs(); viewSettings(); return; }
  if (e.target.id === "laneadd") {
    const a = el("laneA").value, b = el("laneB").value;
    if (a === b) return;
    const list = state.lanes[state.env] || (state.lanes[state.env] = []);
    if (!list.some(([x, y]) => String(x) === a && String(y) === b)) list.push([a, b]);
    save(); renderTabs(); viewSettings(); return;
  }
  const clr = e.target.closest("[data-rpcclear]");
  if (clr) { delete state.rpc[clr.dataset.rpcclear]; save(); viewSettings(); return; }
  if (e.target.id === "cacheclear") { clearCache(); viewSettings(); return; }
});
views.addEventListener("change", (e) => {
  const rpcIn = e.target.closest("[data-rpc]");
  if (rpcIn) {
    const id = rpcIn.dataset.rpc, v = rpcIn.value.trim();
    if (v) state.rpc[id] = v; else delete state.rpc[id];
    save();
  }
});

el("refresh").addEventListener("click", () => { forceNext = true; run(); });   // only the button re-crawls
window.addEventListener("hashchange", () => run());

// no auto-refresh: the ticker only ages the stamp
setInterval(tickStamp, 1000);

// start
if (!location.hash) location.hash = "overview";
run();
</script>
</body>
</html>
