[project]
name = "multichain-ledger"
version = "0.1.0"
description = "Lido multichain deployment ledger tooling"
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format-nongpl]>=4.26.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed (package = false), so the tooling modules under
# scripts/ are imported from there directly. The validate-ledger skill's own
# classifiers decide what every finding in a validation report says, so they are
# exercised here alongside the repo's validators.
pythonpath = ["scripts", ".claude/skills/validate-ledger/scripts"]
